# Ultralytics ByteTrack configuration for IBVAP Stationary CCTV Border Cameras
# gmc_method: none disables optical flow compensation on static cameras for 0-overhead tracking
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True
gmc_method: none
